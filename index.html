<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a1a">
    <title>轻盈笔记 · 减肥助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ========== 启动动画样式（黑白主题） ========== */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .splash-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* 旋转圆环动画 */
        .loader-ring {
            position: relative;
            width: 80px;
            height: 80px;
            margin-bottom: 40px;
        }

        .loader-ring .ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid transparent;
            border-radius: 50%;
            animation: rotate 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        .loader-ring .ring:nth-child(1) {
            border-top-color: #ffffff;
            border-bottom-color: #ffffff;
            animation-delay: 0s;
        }

        .loader-ring .ring:nth-child(2) {
            width: 70px;
            height: 70px;
            top: 5px;
            left: 5px;
            border-left-color: #e0e0e0;
            border-right-color: #e0e0e0;
            animation-delay: 0.3s;
        }

        .loader-ring .ring:nth-child(3) {
            width: 60px;
            height: 60px;
            top: 10px;
            left: 10px;
            border-bottom-color: #c0c0c0;
            border-top-color: #c0c0c0;
            animation-delay: 0.6s;
        }

        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* 心跳图标 */
        .heart-beat {
            font-size: 48px;
            margin-bottom: 30px;
            animation: heartbeat 1.2s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        /* 问候文字区域 */
        .greeting-area {
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s ease-out 0.8s forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .greeting-text {
            color: #f5f5f5;
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 2px;
            margin-bottom: 16px;
            line-height: 1.6;
            max-width: 280px;
            text-align: center;
        }

        .greeting-signature {
            color: #aaaaaa;
            font-size: 0.85rem;
            font-style: italic;
            border-top: 1px solid #333;
            padding-top: 12px;
            display: inline-block;
        }

        .loading-dots {
            margin-top: 30px;
            display: flex;
            gap: 8px;
        }

        .loading-dots span {
            width: 8px;
            height: 8px;
            background: #666;
            border-radius: 50%;
            animation: bounce 1.4s ease-in-out infinite;
        }

        .loading-dots span:nth-child(1) { animation-delay: 0s; }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        /* ========== 主应用样式（优化移动端） ========== */
        body {
            background: linear-gradient(135deg, #f5f7f0 0%, #e8efe3 100%);
            margin: 0;
            padding: 16px;
            min-height: 100vh;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif;
        }

        .main-app {
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .main-app.visible {
            opacity: 1;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            padding: 20px 20px 28px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin: 0 0 4px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            color: #1a4d3e;
        }

        h1 small {
            font-size: 0.7rem;
            background: #e8f3e4;
            padding: 5px 12px;
            border-radius: 40px;
            font-weight: 500;
            color: #2b6e4f;
        }

        .sub {
            color: #6b7c6a;
            border-left: 4px solid #5cb85c;
            padding-left: 12px;
            margin: 6px 0 20px 0;
            font-size: 0.8rem;
        }

        .register-card {
            background: #fefef7;
            border-radius: 20px;
            padding: 16px 18px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8d5;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
        }

        .input-group {
            flex: 1;
            min-width: 140px;
        }

        .input-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #5a7c55;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            font-size: 1rem;
            border: 1.5px solid #dee6d6;
            border-radius: 28px;
            background: white;
            transition: all 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #5cb85c;
            box-shadow: 0 0 0 3px rgba(92, 184, 92, 0.1);
        }

        .input-hint {
            font-size: 0.65rem;
            color: #8aa88a;
            margin-top: 4px;
            padding-left: 12px;
        }

        button {
            background: #2b6e4f;
            color: white;
            border: none;
            padding: 12px 24px;
            font-weight: 600;
            border-radius: 40px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: #1f5a41;
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid #cbdcc2;
            color: #4a6b45;
        }

        .btn-outline:hover {
            background: #f0f6ec;
            transform: none;
        }

        .btn-warning {
            background: #fff3e0;
            color: #b87c2e;
            border: 1px solid #ffe0b5;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: linear-gradient(135deg, #f8faf5 0%, #f1f5ec 100%);
            border-radius: 20px;
            padding: 14px 12px;
            text-align: center;
            border: 1px solid #e0e9d8;
        }

        .stat-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            font-weight: 700;
            color: #7a9874;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: 800;
            color: #2b6e4f;
            line-height: 1.2;
        }

        .stat-unit {
            font-size: 0.7rem;
            font-weight: normal;
            color: #8aa88a;
        }

        .section-title {
            font-weight: 700;
            font-size: 1rem;
            margin: 6px 0 12px 0;
            color: #2c5e3f;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 20px;
            border: 1px solid #e9efdf;
            background: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }

        th {
            background: #f7faf3;
            padding: 12px 6px;
            text-align: center;
            font-weight: 700;
            color: #3d6b48;
            border-bottom: 1px solid #e2e8d5;
        }

        td {
            padding: 10px 5px;
            text-align: center;
            border-bottom: 1px solid #f0f4e8;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .injection-row {
            background: #fffef5;
            border-left: 4px solid #f0b34b;
        }

        .injection-badge {
            background: #f7b84d;
            padding: 3px 10px;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 700;
            color: white;
            display: inline-block;
        }

        .trend-up {
            color: #e67e7e;
            font-weight: 700;
            background: #fff5f5;
            padding: 3px 10px;
            border-radius: 30px;
            display: inline-block;
            font-size: 0.75rem;
        }

        .trend-down {
            color: #5cb85c;
            font-weight: 700;
            background: #f0f9f0;
            padding: 3px 10px;
            border-radius: 30px;
            display: inline-block;
            font-size: 0.75rem;
        }

        .trend-zero {
            color: #96a896;
            background: #f5f7f2;
            padding: 3px 10px;
            border-radius: 30px;
            display: inline-block;
            font-size: 0.75rem;
        }

        .delete-icon {
            background: transparent;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 30px;
            color: #c0a0a0;
        }

        .delete-icon:hover {
            background: #ffeeee;
            color: #d9534f;
        }

        .empty-row {
            text-align: center;
            padding: 40px;
            color: #b8cfb0;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        .injection-info {
            background: #fffbf0;
            border-radius: 16px;
            padding: 10px 16px;
            font-size: 0.7rem;
            color: #a07d3a;
            margin-top: 16px;
            border: 1px solid #fff0cf;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.65rem;
            color: #aec0a6;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 16px;
            }
            .stat-value {
                font-size: 1.2rem;
            }
            th, td {
                padding: 8px 3px;
                font-size: 0.7rem;
            }
            .trend-up, .trend-down, .trend-zero {
                padding: 2px 6px;
                font-size: 0.65rem;
            }
        }
    </style>
</head>
<body>

<!-- 启动动画层 -->
<div class="splash-screen" id="splashScreen">
    <div class="heart-beat">❤️</div>
    <div class="loader-ring">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
    </div>
    <div class="greeting-area">
        <div class="greeting-text">妈咪加油，你一定能减肥成功的！</div>
        <div class="greeting-signature">—— 额古乐</div>
    </div>
    <div class="loading-dots">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

<!-- 主应用 -->
<div class="main-app" id="mainApp">
    <div class="container">
        <h1>
            🧘 轻盈笔记
            <small>💉 每周一针</small>
        </h1>
        <div class="sub">📝 公斤输入 · 自动换算斤显示 · 数据永久保存</div>

        <div class="register-card">
            <div class="form-row">
                <div class="input-group">
                    <label>📅 日期</label>
                    <input type="date" id="recordDate" required>
                </div>
                <div class="input-group">
                    <label>⚖️ 体重 (公斤)</label>
                    <input type="number" id="recordWeight" step="0.1" placeholder="例如 70.5" required>
                    <div class="input-hint">💡 以「公斤」为单位输入</div>
                </div>
                <div>
                    <button id="saveBtn">✨ 登记</button>
                </div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">📆 记录天数</div>
                <div class="stat-value"><span id="totalDays">0</span><span class="stat-unit"> 天</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">💉 下次打针日</div>
                <div class="stat-value" style="font-size:1rem;" id="nextInjection">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">📉 累计减重</div>
                <div class="stat-value"><span id="totalChange">0</span><span class="stat-unit"> 斤</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">🎯 当前体重</div>
                <div class="stat-value"><span id="currentWeight">—</span><span class="stat-unit"> 斤</span></div>
            </div>
        </div>

        <div class="section-title">
            <span>📋</span> 体重变化记录表
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr><th>日期</th><th>体重(斤)</th><th>较前日变化</th><th>打针日</th><th></th></tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="5" class="empty-row">✨ 暂无记录，请在上方登记 ✨</td></tr>
                </tbody>
            </table>
        </div>

        <div class="action-bar">
            <button id="setFirstInjectionBtn" class="btn-outline">📌 设为首个打针日</button>
            <div style="display: flex; gap: 8px;">
                <button id="demoBtn" class="btn-outline">📊 示例</button>
                <button id="clearAllBtn" class="btn-warning">🗑️ 清空</button>
            </div>
        </div>

        <div class="injection-info" id="injectionInfo">
            💡 提示：选中日期后点击上方按钮，设置首个打针日
        </div>
        <footer>
            ✅ 数据自动保存 · 关闭应用再打开依然存在
        </footer>
    </div>
</div>

<script>
    // ========== 启动动画控制 ==========
    let splashScreen = document.getElementById('splashScreen');
    let mainApp = document.getElementById('mainApp');
    
    let minDisplayTime = 1800;
    let startTime = Date.now();
    
    function hideSplash() {
        let elapsed = Date.now() - startTime;
        let remaining = minDisplayTime - elapsed;
        
        if (remaining > 0) {
            setTimeout(() => {
                splashScreen.classList.add('fade-out');
                mainApp.classList.add('visible');
                setTimeout(() => {
                    splashScreen.style.display = 'none';
                }, 800);
            }, remaining);
        } else {
            splashScreen.classList.add('fade-out');
            mainApp.classList.add('visible');
            setTimeout(() => {
                splashScreen.style.display = 'none';
            }, 800);
        }
    }
    
    // ========== 主应用逻辑 ==========
    const STORAGE_KEY = "weight_jin_tracker_mobile";
    let records = {};
    let firstInjectionDate = null;

    function formatDate(date) {
        let y = date.getFullYear();
        let m = String(date.getMonth() + 1).padStart(2, '0');
        let d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    function parseDate(str) {
        let [y, m, d] = str.split('-').map(Number);
        return new Date(y, m-1, d);
    }

    function getSortedDates() {
        return Object.keys(records).sort((a,b) => new Date(a) - new Date(b));
    }

    function kgToJin(kg) { return kg * 2; }

    function isInjectionDay(dateStr) {
        if (!firstInjectionDate) return false;
        let firstDate = parseDate(firstInjectionDate);
        let currDate = parseDate(dateStr);
        let diffDays = Math.round((currDate - firstDate) / (1000 * 3600 * 24));
        return diffDays >= 0 && diffDays % 7 === 0;
    }

    function getNextInjectionDateStr() {
        if (!firstInjectionDate) return "未设置";
        let firstDate = parseDate(firstInjectionDate);
        let today = new Date();
        today.setHours(0,0,0,0);
        let offset = 0;
        for(let i = 0; i < 30; i++) {
            let candidate = new Date(firstDate);
            candidate.setDate(firstDate.getDate() + offset);
            if(candidate >= today) return formatDate(candidate);
            offset += 7;
        }
        return "计算中";
    }

    function computeStatsAndChanges() {
        let dates = getSortedDates();
        if(dates.length === 0) {
            document.getElementById('totalDays').innerText = '0';
            document.getElementById('nextInjection').innerText = firstInjectionDate ? getNextInjectionDateStr() : '—';
            document.getElementById('totalChange').innerText = '0';
            document.getElementById('currentWeight').innerText = '—';
            return new Map();
        }

        let earliestJin = kgToJin(records[dates[0]].kg);
        let latestJin = kgToJin(records[dates[dates.length-1]].kg);
        document.getElementById('totalChange').innerText = (earliestJin - latestJin).toFixed(1);
        document.getElementById('totalDays').innerText = dates.length;
        document.getElementById('nextInjection').innerText = firstInjectionDate ? getNextInjectionDateStr() : '点击按钮设置';
        document.getElementById('currentWeight').innerText = latestJin.toFixed(1);

        let changeMap = new Map();
        for(let i = 0; i < dates.length; i++) {
            if(i === 0) {
                changeMap.set(dates[i], { formatted: '—', className: 'trend-zero' });
            } else {
                let currJin = kgToJin(records[dates[i]].kg);
                let prevJin = kgToJin(records[dates[i-1]].kg);
                let diffJin = currJin - prevJin;
                let formatted = diffJin > 0 ? `+${diffJin.toFixed(1)}` : diffJin.toFixed(1);
                let className = diffJin > 0 ? 'trend-up' : (diffJin < 0 ? 'trend-down' : 'trend-zero');
                changeMap.set(dates[i], { formatted, className });
            }
        }
        return changeMap;
    }

    function updateInjectionInfo() {
        let infoDiv = document.getElementById('injectionInfo');
        if(firstInjectionDate) {
            infoDiv.innerHTML = `💉 首个打针日：${firstInjectionDate} · 每7天自动标记 · 下次打针日：${getNextInjectionDateStr()}`;
        } else {
            infoDiv.innerHTML = `💡 提示：选中日期后点击上方"设为首个打针日"按钮，之后每7天自动标记打针日。`;
        }
    }

    function renderTable() {
        let tbody = document.getElementById('tableBody');
        let dates = getSortedDates();
        if(dates.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-row">✨ 暂无记录，请在上方登记 ✨</td></tr>';
            computeStatsAndChanges();
            updateInjectionInfo();
            return;
        }

        let changeMap = computeStatsAndChanges();
        let html = '';
        for(let i = 0; i < dates.length; i++) {
            let date = dates[i];
            let jinVal = kgToJin(records[date].kg);
            let isInjection = isInjectionDay(date);
            let change = changeMap.get(date) || { formatted: '—', className: 'trend-zero' };
            let injectionHtml = isInjection ? '<span class="injection-badge">💉 打针日</span>' : '—';
            let rowClass = isInjection ? 'injection-row' : '';
            
            html += `<tr class="${rowClass}">
                        <td style="font-weight:500;">${date}</td>
                        <td><strong>${jinVal.toFixed(1)}</strong> 斤</td>
                        <td><span class="${change.className}">${change.formatted}</span></td>
                        <td>${injectionHtml}</td>
                        <td><button class="delete-icon" data-date="${date}" title="删除">🗑️</button></td>
                      </tr>`;
        }
        tbody.innerHTML = html;
        
        document.querySelectorAll('.delete-icon').forEach(btn => {
            btn.addEventListener('click', (e) => {
                let date = btn.getAttribute('data-date');
                if(date && records[date] && confirm(`删除 ${date} 的记录？`)) {
                    delete records[date];
                    saveAndRender();
                }
            });
        });
        updateInjectionInfo();
    }

    function saveAndRender() {
        let data = { records: records, firstInjectionDate: firstInjectionDate };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        renderTable();
    }

    function addRecord() {
        let date = document.getElementById('recordDate').value;
        let weightKg = parseFloat(document.getElementById('recordWeight').value);
        if(!date) { alert('请选择日期'); return; }
        if(isNaN(weightKg) || weightKg <= 0 || weightKg > 300) { alert('请输入有效体重（公斤，20~300 kg）'); return; }
        records[date] = { kg: weightKg };
        saveAndRender();
        document.getElementById('recordWeight').value = '';
        document.getElementById('recordWeight').focus();
    }

    function setFirstInjection() {
        let selectedDate = document.getElementById('recordDate').value;
        if(!selectedDate) { alert('请先选择日期'); return; }
        if(!records[selectedDate]) {
            if(confirm(`您还没有登记 ${selectedDate} 的体重。是否先登记并设为首个打针日？`)) {
                let kg = prompt(`请输入 ${selectedDate} 的体重（公斤）：`, "70");
                if(kg && !isNaN(parseFloat(kg))) {
                    records[selectedDate] = { kg: parseFloat(kg) };
                    firstInjectionDate = selectedDate;
                    saveAndRender();
                    alert(`✅ 已将 ${selectedDate} 设为首个打针日`);
                }
            }
            return;
        }
        firstInjectionDate = selectedDate;
        saveAndRender();
        alert(`✅ 已将 ${selectedDate} 设为首个打针日`);
    }

    function clearAll() {
        if(confirm('⚠️ 清空所有数据？无法恢复。')) {
            records = {};
            firstInjectionDate = null;
            saveAndRender();
        }
    }

    function loadDemo() {
        if(Object.keys(records).length > 0 && !confirm('加载示例会覆盖现有数据，确定吗？')) return;
        let demo = {};
        let start = new Date();
        start.setDate(start.getDate() - 14);
        let kgData = [78.2, 77.5, 77.0, 76.2, 75.6, 74.9, 74.3, 73.8, 73.0, 72.4, 71.7, 71.0, 70.3, 69.5];
        for(let i = 0; i < kgData.length; i++) {
            let d = new Date(start);
            d.setDate(start.getDate() + i);
            demo[formatDate(d)] = { kg: kgData[i] };
        }
        records = demo;
        firstInjectionDate = getSortedDates()[0];
        saveAndRender();
        alert(`✅ 示例加载完成，首个打针日：${firstInjectionDate}`);
    }

    function initApp() {
        let stored = localStorage.getItem(STORAGE_KEY);
        if(stored) {
            try {
                let data = JSON.parse(stored);
                records = data.records || {};
                firstInjectionDate = data.firstInjectionDate || null;
            } catch(e) { console.warn(e); }
        }
        document.getElementById('recordDate').value = formatDate(new Date());
        document.getElementById('saveBtn').addEventListener('click', addRecord);
        document.getElementById('setFirstInjectionBtn').addEventListener('click', setFirstInjection);
        document.getElementById('clearAllBtn').addEventListener('click', clearAll);
        document.getElementById('demoBtn').addEventListener('click', loadDemo);
        document.getElementById('recordWeight').addEventListener('keypress', (e) => { if(e.key === 'Enter') addRecord(); });
        renderTable();
        
        hideSplash();
    }
    
    initApp();
</script>
</body>
</html>
